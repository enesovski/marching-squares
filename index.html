
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marching Squares Editor</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <svg class="icon brand-icon"><use href="./icons/editor.svg#grid"></use></svg>
                <span>Marching Squares</span>
            </div>

            <span class="topbar-divider"></span>

            <div class="project-title">
                <button id="projectTitleButton" class="project-title-button" type="button" title="Rename project">
                    <svg class="icon"><use href="./icons/editor.svg#file"></use></svg>
                    <span id="projectTitleText" class="project-title-text">Untitled Project</span>
                    <span id="unsavedIndicator" class="unsaved-indicator" hidden></span>
                    <svg class="icon icon-small edit-icon"><use href="./icons/editor.svg#pencil"></use></svg>
                </button>
                <input id="projectTitleInput" type="text" aria-label="Project name"
                       maxlength="60" spellcheck="false" hidden>
            </div>

            <div class="topbar-actions">
                <label class="grid-selector" for="gridResolution">
                    <svg class="icon"><use href="./icons/editor.svg#grid"></use></svg>
                    <span>Grid</span>
                    <select id="gridResolution" title="Grid resolution">
                        <option value="20">20 × 20</option>
                        <option value="40" selected>40 × 40</option>
                        <option value="80">80 × 80</option>
                    </select>
                </label>

                <span class="topbar-divider"></span>

                <button id="undoButton" class="icon-button" type="button"
                        title="Undo" aria-label="Undo" disabled>
                    <svg class="icon"><use href="./icons/editor.svg#undo"></use></svg>
                </button>
                <button id="redoButton" class="icon-button" type="button"
                        title="Redo" aria-label="Redo" disabled>
                    <svg class="icon"><use href="./icons/editor.svg#redo"></use></svg>
                </button>

                <span class="topbar-divider"></span>

                <button id="loadButton" class="icon-button" type="button"
                        title="Open project" aria-label="Open project">
                    <svg class="icon"><use href="./icons/editor.svg#folder-open"></use></svg>
                </button>
                <button id="saveButton" class="primary-button" type="button">
                    <svg class="icon"><use href="./icons/editor.svg#save"></use></svg>
                    Save
                </button>
            </div>
        </header>

        <div class="editor-body">
            <nav class="tool-rail" aria-label="Canvas tools">
                <button id="brushToolButton" class="tool-button is-active" type="button"
                        title="Brush" aria-label="Brush" aria-pressed="true">
                    <svg class="icon"><use href="./icons/editor.svg#brush"></use></svg>
                </button>
                <button id="panToolButton" class="tool-button" type="button"
                        title="Pan" aria-label="Pan" aria-pressed="false">
                    <svg class="icon"><use href="./icons/editor.svg#hand"></use></svg>
                </button>

                <span class="rail-divider"></span>

                <button id="zoomInButton" class="tool-button" type="button"
                        title="Zoom in" aria-label="Zoom in">
                    <svg class="icon"><use href="./icons/editor.svg#zoom-in"></use></svg>
                </button>
                <button id="zoomOutButton" class="tool-button" type="button"
                        title="Zoom out" aria-label="Zoom out">
                    <svg class="icon"><use href="./icons/editor.svg#zoom-out"></use></svg>
                </button>
                <button id="fitCanvasButton" class="tool-button" type="button"
                        title="Reset view" aria-label="Reset view">
                    <svg class="icon"><use href="./icons/editor.svg#maximize"></use></svg>
                </button>
            </nav>

            <main class="workspace" aria-label="Drawing workspace">
                <canvas id="glCanvas" width="800" height="800"
                        aria-label="Marching Squares drawing canvas"></canvas>

                <div class="view-switcher" role="group" aria-label="Display mode">
                    <button id="marchingViewButton" type="button" aria-pressed="false">Marching</button>
                    <button id="gridViewButton" type="button" aria-pressed="true">Grid</button>
                </div>
            </main>

            <aside class="inspector" aria-label="Editor properties">
                <section class="panel-section">
                    <h2>Brush</h2>

                    <div class="field">
                        <label for="brushType">Shape</label>
                        <select id="brushType">
                            <option value="circle">Circle</option>
                            <option value="square">Square</option>
                        </select>
                    </div>

                    <div class="field">
                        <div class="field-heading">
                            <label for="brushSize">Size</label>
                            <output id="brushSizeValue" for="brushSize">1</output>
                        </div>
                        <input id="brushSize" type="range" min="1" max="9" step="2" value="1">
                    </div>
                </section>

                <section class="panel-section">
                    <h2>Appearance</h2>

                    <div class="color-field">
                        <label for="fillColor">Fill</label>
                        <input id="fillColor" type="color" value="#262626">
                    </div>
                    <div class="color-field">
                        <label for="boundaryColor">Boundary</label>
                        <input id="boundaryColor" type="color" value="#CC1A1A">
                    </div>
                    <div class="color-field">
                        <label for="boardColor">Background</label>
                        <input id="boardColor" type="color" value="#E6E6E6">
                    </div>
                </section>

                <section class="panel-section">
                    <h2>Display</h2>

                    <label class="toggle-field">
                        <span>Grid Lines</span>
                        <input id="gridLinesToggle" type="checkbox" checked>
                        <span class="toggle-track" aria-hidden="true"></span>
                    </label>

                    <div id="marchingDisplayControls" hidden>
                        <label class="toggle-field">
                            <span>Fill</span>
                            <input id="marchingFillToggle" type="checkbox" checked>
                            <span class="toggle-track" aria-hidden="true"></span>
                        </label>
                        <label class="toggle-field">
                            <span>Boundary</span>
                            <input id="marchingBoundaryToggle" type="checkbox" checked>
                            <span class="toggle-track" aria-hidden="true"></span>
                        </label>
                    </div>
                </section>

                <section class="panel-section panel-actions">
                    <button id="clearButton" class="secondary-button" type="button">
                        <svg class="icon"><use href="./icons/editor.svg#trash"></use></svg>
                        Clear Canvas
                    </button>
                </section>
            </aside>
        </div>

        <footer class="statusbar">
            <div class="status-info">
                <span id="statusView">Grid</span>
                <span id="statusGrid">40 × 40</span>
                <span id="statusZoom">100%</span>
            </div>

            <div class="status-help">
                <span class="shortcut">
                    <svg class="icon"><use href="./icons/editor.svg#mouse-left"></use></svg>
                    <span id="statusToolHelp"><strong>LMB</strong> Draw</span>
                </span>
                <span class="shortcut">
                    <svg class="icon"><use href="./icons/editor.svg#mouse-middle"></use></svg>
                    <span><strong>MMB</strong> Pan</span>
                </span>
                <span class="shortcut">
                    <svg class="icon"><use href="./icons/editor.svg#mouse-wheel"></use></svg>
                    <span><strong>Wheel</strong> Zoom</span>
                </span>
            </div>
        </footer>
    </div>

    <input id="loadFileInput" type="file" accept=".json,application/json" hidden>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
