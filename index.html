<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CS465 Assignment 1</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <button id="toggleView">Switch to Marching Squares</button>

    <button id="toggleMarchingMode">Marching Mode: Lines</button>

    <label for="brushType">Brush:</label>
    <select id="brushType">
        <option value="circle">Circle</option>
        <option value="square">Square</option>
    </select>

    <label for="brushSize">Brush Size:</label>
    <input
        id="brushSize"
        type="range"
        min="1"
        max="9"
        step="2"
        value="1">
    <span id="brushSizeValue">1</span>

    <label for="gridResolution">Grid:</label>
    <select id="gridResolution">
        <option value="20">20 x 20</option>
        <option value="40" selected>40 x 40</option>
        <option value="80">80 x 80</option>
    </select>

    <label for="backgroundColor">Background:</label>
    <input id="backgroundColor" type="color" value="#E6E6E6">

    <label for="fillColor">Fill:</label>
    <input id="fillColor" type="color" value="#262626">

    <label for="boundaryColor">Boundary:</label>
    <input id="boundaryColor" type="color" value="#CC1A1A">

    <button id="undoButton" disabled>Undo</button>
    <button id="redoButton" disabled>Redo</button>
    <button id="clearButton">Clear</button>

    <button id="saveButton">Save</button>
    <button id="loadButton">Load</button>

    <input id="loadFileInput" type="file" accept=".json" hidden>

    <br><br>

    <canvas id="glCanvas" width="800" height="800"></canvas>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
