<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CS465 Assignment 1</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <button id="toggleView">Switch to Marching Squares</button>

    <button id="toggleMarchingMode">Marching Mode: Lines</button>

    <label for="brushType">Brush:</label>
    <select id="brushType"></select>

    <label for="brushSize">Brush Size:</label>
    <input
        id="brushSize"
        type="range">
    <span id="brushSizeValue"></span>

    <label for="gridResolution">Grid:</label>
    <select id="gridResolution"></select>

    <label for="backgroundColor">Background:</label>
    <input id="backgroundColor" type="color">

    <label for="fillColor">Fill:</label>
    <input id="fillColor" type="color">

    <label for="boundaryColor">Boundary:</label>
    <input id="boundaryColor" type="color">

    <button id="undoButton" disabled>Undo</button>
    <button id="redoButton" disabled>Redo</button>
    <button id="clearButton">Clear</button>

    <button id="saveButton">Save</button>
    <button id="loadButton">Load</button>

    <input id="loadFileInput" type="file" accept=".json" hidden>

    <br><br>

    <canvas id="glCanvas" width="800" height="800"></canvas>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
